<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Flower Lab · Pedido confirmado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #EDE8DF; color: #1C1410;
      font-family: 'Jost', sans-serif; font-weight: 300;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 40px 24px;
    }
    .card {
      max-width: 520px; width: 100%; text-align: center;
      background: #fff; padding: 64px 48px;
      border: 1px solid rgba(110,42,56,0.1);
    }
    .ornament {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 56px; color: #DAAEB5; margin-bottom: 24px; line-height: 1;
    }
    .eyebrow {
      font-family: 'Jost', sans-serif; font-weight: 200; font-size: 9;
      letter-spacing: 6px; color: #6E2A38; opacity: 0.7; margin-bottom: 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 42px;
      line-height: 1.1; color: #1C1410; margin-bottom: 24px;
    }
    p {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
      font-size: 17px; line-height: 1.6; color: #3D3028; margin-bottom: 16px;
    }
    .order-id {
      font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px;
      letter-spacing: 2px; color: #1C1410; opacity: 0.5;
      padding: 12px 16px; background: #EDE8DF; margin: 24px 0;
      word-break: break-all;
    }
    a.btn {
      display: inline-block; margin-top: 16px; padding: 14px 32px;
      background: #6E2A38; color: #EDE8DF; text-decoration: none;
      font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px;
      letter-spacing: 4px; text-transform: uppercase;
    }
    .divider { width: 40px; height: 1px; background: #C8818C; margin: 24px auto; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament">✿</div>
    <div class="eyebrow">PEDIDO CONFIRMADO</div>
    <h1>Gracias por tu pedido</h1>
    <div class="divider"></div>
    <p>Recibimos tu pago y empezamos a preparar tu arreglo con todo el cuidado que se merece.</p>
    <p>Te enviaremos un mensaje muy pronto con los detalles de entrega.</p>
    <div class="order-id" id="order-id">Cargando referencia…</div>
    <a href="index.html" class="btn">Volver al inicio</a>
  </div>
  <script>
    // Limpiar carrito y mostrar referencia de pago
    try { localStorage.removeItem('flowerlab_cart'); } catch (e) {}
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const el = document.getElementById('order-id');
    if (sessionId) {
      el.textContent = 'REF: ' + sessionId;
    } else {
      el.style.display = 'none';
    }
  </script>
</body>
</html>
