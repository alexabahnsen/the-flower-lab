          {ARRANGEMENTS[col.id] && (
            <div style={{ padding: '40px 80px 120px', maxWidth: 1200, margin: '0 auto' }}>

              {/* Sort controls */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 32 }}>
                <span style={{ fontFamily: "'Jost', sans-serif", fontWeight: 200, fontSize: 9, letterSpacing: 4, color: C.ink, opacity: 0.5 }}>ORDENAR POR:</span>
                {[
                  { label: 'Por defecto', value: 'none' },
                  { label: 'Precio: menor a mayor', value: 'asc' },
                  { label: 'Precio: mayor a menor', value: 'desc' },
                ].map(opt => (
                  <button key={opt.value} onClick={() => setSortOrder(opt.value)} style={{
                    background: sortOrder === opt.value ? C.wine : 'transparent',
                    border: `1px solid ${sortOrder === opt.value ? C.wine : 'rgba(110,42,56,0.25)'}`,
                    cursor: 'pointer',
                    fontFamily: "'Jost', sans-serif", fontWeight: 300, fontSize: 9,
                    letterSpacing: 3, color: sortOrder === opt.value ? C.cream : C.ink,
                    padding: '8px 18px', transition: 'all 0.2s ease',
                  }}>{opt.label}</button>
                ))}
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24 }}>
                {(sortOrder === 'none' ? [...ARRANGEMENTS[col.id]] : [...ARRANGEMENTS[col.id]].sort((a, b) => sortOrder === 'asc' ? a.price - b.price : b.price - a.price)).map(arr => (
                  <ArrangementCard key={arr.id} arr={arr} col={col} onAddToCart={(item) => {
                    setCartItems(prev => {
                      const idx = prev.findIndex(i => i.arrangementId === item.arrangementId);
                      if (idx >= 0) {
                        const next = [...prev];
                        next[idx] = { ...next[idx], qty: next[idx].qty + 1 };
                        return next;
                      }
                      return [...prev, { ...item, qty: 1 }];
                    });
                    setCartOpen(true);
                  }} />
                ))}
              </div>
            </div>
          )}

          <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} items={cartItems} onQty={updateQty} onRemove={removeItem} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CollectionPage />);
  </script>
</body>
</html>
